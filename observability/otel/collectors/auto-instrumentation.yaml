# =============================================================================
# OpenTelemetry Auto-Instrumentation CRs
# =============================================================================
# These require the OpenTelemetry Operator to be installed in the cluster.
# Each CR configures automatic instrumentation for a specific runtime.
# =============================================================================

# --- .NET Auto-Instrumentation ---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: dotnet-instrumentation
  namespace: observability
spec:
  exporter:
    endpoint: http://otel-collector.observability:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "0.1"
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.2.0
    env:
      - name: OTEL_DOTNET_AUTO_TRACES_ASPNETCORE_INSTRUMENTATION_CAPTURE_REQUEST_HEADERS
        value: "Content-Type,X-Request-ID"
      - name: OTEL_DOTNET_AUTO_METRICS_INSTRUMENTATION_ENABLED
        value: "true"
---
# --- Node.js Auto-Instrumentation ---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: nodejs-instrumentation
  namespace: observability
spec:
  exporter:
    endpoint: http://otel-collector.observability:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "0.1"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.46.0
    env:
      - name: OTEL_NODE_RESOURCE_DETECTORS
        value: "env,host,os,process,container"
---
# --- Python Auto-Instrumentation ---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
