apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: python-api
  description: "Python FastAPI service with OpenTelemetry instrumentation"
  annotations:
    github.com/project-slug: YOUR_ORG/python-api
    backstage.io/techdocs-ref: dir:.
    argocd/app-name: python-api
    grafana/dashboard-selector: "app=python-api"
    prometheus.io/rule: python-api
  tags:
    - python
    - fastapi
    - api
    - platform-accelerator
  links:
    - url: https://github.com/YOUR_ORG/python-api
      title: GitHub Repository
      icon: github
    - url: https://grafana.internal/d/platform-app-dashboard?var-service=python-api
      title: Grafana Dashboard
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: group:platform-engineering
  system: platform
  providesApis:
    - python-api-api
  dependsOn:
    - resource:default/otel-collector
