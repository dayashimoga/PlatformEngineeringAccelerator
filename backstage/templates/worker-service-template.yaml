apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: worker-service-template
  title: Worker Service Template
  description: Create a production-ready .NET 8 background worker service with OpenTelemetry and GitOps.
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Provide service details
      required:
        - name
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name of the worker service
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Owner team of this worker service
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group

    - title: Choose location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ../../golden-templates/worker-service
        values:
          serviceName: ${{ parameters.name }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish Repository
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: 'Bootstrapped from Backstage Worker Template'
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Catalog Link
        url: ${{ steps['register'].output.catalogInfoUrl }}
