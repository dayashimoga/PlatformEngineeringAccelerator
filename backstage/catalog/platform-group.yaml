apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-engineering
  description: "The core platform engineering team responsible for accelerators, shared infrastructure, and GitOps pipelines."
spec:
  type: team
  profile:
    displayName: Platform Engineering Team
    email: platform-eng@example.com
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: platform-admin
  description: "Lead Platform Engineer"
spec:
  profile:
    displayName: Platform Admin
    email: platform-admin@example.com
  memberOf:
    - platform-engineering
