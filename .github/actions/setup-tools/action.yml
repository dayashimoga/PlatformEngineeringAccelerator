name: "Setup Platform Tools"
description: "Install shared tooling for platform engineering workflows"

inputs:
  helm-version:
    description: "Helm version to install"
    required: false
    default: "3.14.0"
  kubectl-version:
    description: "kubectl version to install"
    required: false
    default: "1.29.0"
  terraform-version:
    description: "Terraform version to install"
    required: false
    default: "1.7.0"
  trivy-version:
    description: "Trivy version to install"
    required: false
    default: "0.49.0"
  cosign-version:
    description: "Cosign version to install"
    required: false
    default: "2.2.3"
  kubeconform-version:
    description: "Kubeconform version to install"
    required: false
    default: "0.6.4"
  install-helm:
    description: "Install Helm"
    required: false
    default: "true"
  install-kubectl:
    description: "Install kubectl"
    required: false
    default: "true"
  install-terraform:
    description: "Install Terraform"
    required: false
    default: "false"
  install-trivy:
    description: "Install Trivy"
    required: false
    default: "false"
  install-cosign:
    description: "Install Cosign"
    required: false
    default: "false"
  install-kubeconform:
    description: "Install Kubeconform"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Helm
      if: inputs.install-helm == 'true'
      uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      with:
        version: v${{ inputs.helm-version }}

    - name: Install kubectl
      if: inputs.install-kubectl == 'true'
      uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
      with:
        version: v${{ inputs.kubectl-version }}

    - name: Install Terraform
      if: inputs.install-terraform == 'true'
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Install Trivy
      if: inputs.install-trivy == 'true'
      shell: bash
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${{ inputs.trivy-version }}
        trivy --version

    - name: Install Cosign
      if: inputs.install-cosign == 'true'
      uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      with:
        cosign-release: v${{ inputs.cosign-version }}

    - name: Install Kubeconform
      if: inputs.install-kubeconform == 'true'
      shell: bash
      run: |
        curl -sL "https://github.com/yannh/kubeconform/releases/download/v${{ inputs.kubeconform-version }}/kubeconform-linux-amd64.tar.gz" | \
          tar xz -C /usr/local/bin
        kubeconform -v

    - name: Verify installations
      shell: bash
      run: |
        echo "=== Installed Tools ==="
        command -v helm && helm version --short || true
        command -v kubectl && kubectl version --client --short 2>/dev/null || true
        command -v terraform && terraform version || true
        command -v trivy && trivy --version || true
        command -v cosign && cosign version || true
        command -v kubeconform && kubeconform -v || true
        echo "======================"
