# =============================================================================
# Alert Rules — CPU, Memory, Pod, Latency, Error Rate, Availability
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: platform-accelerator
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # =======================================================================
    # CPU Alerts
    # =======================================================================
    - name: cpu-alerts
      rules:
        - alert: HighCPUUsage
          expr: |
            (sum(rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])) by (namespace, pod)
            / sum(kube_pod_container_resource_limits{resource="cpu"}) by (namespace, pod)) > 0.85
          for: 5m
          labels:
            severity: warning
            category: resource
          annotations:
            summary: "High CPU usage detected"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has CPU usage above 85% for 5 minutes. Current: {{ $value | humanizePercentage }}"
            runbook_url: "https://github.com/YOUR_ORG/platform-engineering-accelerator/blob/main/docs/runbooks/high-cpu.md"

        - alert: CriticalCPUUsage
          expr: |
            (sum(rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])) by (namespace, pod)
            / sum(kube_pod_container_resource_limits{resource="cpu"}) by (namespace, pod)) > 0.95
          for: 2m
          labels:
            severity: critical
            category: resource
          annotations:
            summary: "Critical CPU usage detected"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has CPU usage above 95% for 2 minutes."

    # =======================================================================
    # Memory Alerts
    # =======================================================================
    - name: memory-alerts
      rules:
        - alert: HighMemoryUsage
          expr: |
            (sum(container_memory_working_set_bytes{container!="",container!="POD"}) by (namespace, pod)
            / sum(kube_pod_container_resource_limits{resource="memory"}) by (namespace, pod)) > 0.85
          for: 5m
          labels:
            severity: warning
            category: resource
          annotations:
            summary: "High memory usage detected"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has memory usage above 85%. Current: {{ $value | humanizePercentage }}"
            runbook_url: "https://github.com/YOUR_ORG/platform-engineering-accelerator/blob/main/docs/runbooks/high-memory.md"

        - alert: CriticalMemoryUsage
          expr: |
            (sum(container_memory_working_set_bytes{container!="",container!="POD"}) by (namespace, pod)
            / sum(kube_pod_container_resource_limits{resource="memory"}) by (namespace, pod)) > 0.95
          for: 2m
          labels:
            severity: critical
            category: resource
          annotations:
            summary: "Critical memory usage — OOMKill imminent"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has memory usage above 95%."

    # =======================================================================
    # Pod Health Alerts
    # =======================================================================
    - name: pod-alerts
      rules:
        - alert: PodRestart
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
          for: 0m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "Pod restart detected"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last hour."
            runbook_url: "https://github.com/YOUR_ORG/platform-engineering-accelerator/blob/main/docs/runbooks/pod-crashloop.md"

        - alert: CrashLoopBackOff
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 5m
          labels:
            severity: critical
            category: availability
          annotations:
            summary: "Pod in CrashLoopBackOff"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in CrashLoopBackOff state for 5 minutes."

        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="true"} == 0
          for: 10m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "Pod not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for 10 minutes."

    # =======================================================================
    # Latency Alerts
    # =======================================================================
    - name: latency-alerts
      rules:
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service, namespace)) > 1
          for: 5m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "High request latency detected"
            description: "Service {{ $labels.service }} in namespace {{ $labels.namespace }} has P95 latency above 1 second. Current: {{ $value }}s"
            runbook_url: "https://github.com/YOUR_ORG/platform-engineering-accelerator/blob/main/docs/runbooks/high-latency.md"

        - alert: CriticalLatency
          expr: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service, namespace)) > 5
          for: 2m
          labels:
            severity: critical
            category: performance
          annotations:
            summary: "Critical request latency"
            description: "Service {{ $labels.service }} P99 latency exceeds 5 seconds."

    # =======================================================================
    # Error Rate Alerts
    # =======================================================================
    - name: error-alerts
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service, namespace)
            / sum(rate(http_requests_total[5m])) by (service, namespace) > 0.05
          for: 5m
          labels:
            severity: warning
            category: reliability
          annotations:
            summary: "High error rate detected"
            description: "Service {{ $labels.service }} in namespace {{ $labels.namespace }} has error rate above 5%. Current: {{ $value | humanizePercentage }}"

        - alert: CriticalErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service, namespace)
            / sum(rate(http_requests_total[5m])) by (service, namespace) > 0.15
          for: 2m
          labels:
            severity: critical
            category: reliability
          annotations:
            summary: "Critical error rate — service degraded"
            description: "Service {{ $labels.service }} error rate exceeds 15%."

    # =======================================================================
    # Availability Alerts
    # =======================================================================
    - name: availability-alerts
      rules:
        - alert: ServiceUnavailable
          expr: |
            up{job=~"kubernetes-service-endpoints|kubernetes-pods"} == 0
          for: 2m
          labels:
            severity: critical
            category: availability
          annotations:
            summary: "Service unavailable"
            description: "Service {{ $labels.service }} in namespace {{ $labels.namespace }} is down."
            runbook_url: "https://github.com/YOUR_ORG/platform-engineering-accelerator/blob/main/docs/runbooks/service-unavailable.md"

        - alert: EndpointDown
          expr: kube_endpoint_address_available == 0
          for: 5m
          labels:
            severity: critical
            category: availability
          annotations:
            summary: "No endpoints available"
            description: "Service {{ $labels.endpoint }} has no available endpoints for 5 minutes."
