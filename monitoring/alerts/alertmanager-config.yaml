# =============================================================================
# AlertManager Configuration — Email, Slack, Microsoft Teams
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.your-org.com:587"
      smtp_from: "alerts@your-org.com"
      smtp_auth_username: "alerts@your-org.com"
      smtp_require_tls: true
      slack_api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"

    templates:
      - "/etc/alertmanager/templates/*.tmpl"

    route:
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
      routes:
        # Critical alerts → immediate notification to all channels
        - match:
            severity: critical
          receiver: "critical-all-channels"
          group_wait: 10s
          repeat_interval: 1h

        # Warning alerts → Slack only
        - match:
            severity: warning
          receiver: "warning-slack"
          group_wait: 1m
          repeat_interval: 4h

        # Resource alerts
        - match:
            category: resource
          receiver: "resource-alerts"

        # Availability alerts
        - match:
            category: availability
          receiver: "critical-all-channels"

    receivers:
      - name: "default"
        slack_configs:
          - channel: "#platform-alerts"
            send_resolved: true
            title: '{{ "{{ .Status | toUpper }}" }} | {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              *Severity:* {{ "{{ .Labels.severity }}" }}
              *Namespace:* {{ "{{ .Labels.namespace }}" }}
              {{ "{{ end }}" }}

      - name: "critical-all-channels"
        slack_configs:
          - channel: "#platform-critical"
            send_resolved: true
            color: '{{ "{{ if eq .Status \"firing\" }}" }}danger{{ "{{ else }}" }}good{{ "{{ end }}" }}'
            title: '🚨 CRITICAL | {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              *Runbook:* {{ "{{ .Annotations.runbook_url }}" }}
              {{ "{{ end }}" }}
        email_configs:
          - to: "oncall@your-org.com"
            send_resolved: true
            headers:
              Subject: '🚨 CRITICAL: {{ "{{ .CommonLabels.alertname }}" }} in {{ "{{ .CommonLabels.namespace }}" }}'
        webhook_configs:
          # Microsoft Teams via webhook
          - url: "https://outlook.office.com/webhook/YOUR_TEAMS_WEBHOOK"
            send_resolved: true

      - name: "warning-slack"
        slack_configs:
          - channel: "#platform-warnings"
            send_resolved: true
            title: '⚠️ WARNING | {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *{{ "{{ .Annotations.summary }}" }}*
              {{ "{{ .Annotations.description }}" }}
              {{ "{{ end }}" }}

      - name: "resource-alerts"
        slack_configs:
          - channel: "#platform-resources"
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: "critical"
        target_match:
          severity: "warning"
        equal: ["alertname", "namespace"]
