# Dev environment overrides
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

pdb:
  enabled: false

ingress:
  hosts:
    - host: app.dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-dev-tls
      hosts:
        - app.dev.example.com

config:
  APP_PORT: "8080"
  LOG_LEVEL: "Debug"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
