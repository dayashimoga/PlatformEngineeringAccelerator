apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  trigger.on-sync-failed: |
    - when: app.status.sync.status == 'Failed'
      send: [slack, teams]
  trigger.on-sync-succeeded: |
    - when: app.status.sync.status == 'Synced'
      send: [slack]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [slack, teams]

  template.slack: |
    email: {{.recipient}}
    slack:
      attachments:
      - title: "ArgoCD Application {{.app.metadata.name}} - {{.app.status.sync.status}}"
        text: "Application {{.app.metadata.name}} has sync status {{.app.status.sync.status}}. Health status is {{.app.status.health.status}}."
        color: "{{if eq .app.status.sync.status 'Synced'}}good{{else}}danger{{end}}"

  template.teams: |
    teams:
      title: "ArgoCD Alert - {{.app.metadata.name}}"
      text: "Application {{.app.metadata.name}} is {{.app.status.sync.status}} (Health: {{.app.status.health.status}})."
      themeColor: "{{if eq .app.status.sync.status 'Synced'}}00FF00{{else}}FF0000{{end}}"
