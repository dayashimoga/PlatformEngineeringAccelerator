apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-service-prod
  namespace: argocd
  labels:
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_ORG/platform-engineering-accelerator.git
    targetRevision: HEAD
    path: platform/kubernetes/helm
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # Manual synchronization for production release safety
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
