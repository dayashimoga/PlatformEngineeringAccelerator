apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-service-uat
  namespace: argocd
  labels:
    environment: uat
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_ORG/platform-engineering-accelerator.git
    targetRevision: HEAD
    path: platform/kubernetes/helm
    helm:
      valueFiles:
        - values-uat.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
