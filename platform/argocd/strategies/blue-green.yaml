# =============================================================================
# Blue/Green Deployment Strategy — Argo Rollouts
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app-bluegreen
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    blueGreen:
      activeService: app-active
      previewService: app-preview
      autoPromotionEnabled: false
      autoPromotionSeconds: 300
      scaleDownDelaySeconds: 60
      prePromotionAnalysis:
        templates:
          - templateName: bluegreen-analysis
        args:
          - name: service-name
            value: app-preview
      postPromotionAnalysis:
        templates:
          - templateName: bluegreen-analysis
        args:
          - name: service-name
            value: app-active
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          image: ghcr.io/org/app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluegreen-analysis
spec:
  args:
    - name: service-name
  metrics:
    - name: health-check
      interval: 10s
      count: 5
      successCondition: result == "Healthy"
      provider:
        web:
          url: "http://{{args.service-name}}/healthz"
          jsonPath: "{$.status}"
    - name: error-rate
      interval: 30s
      successCondition: result[0] < 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[1m])) /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[1m]))
